name: Debug OneSignal (temporaneo)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy players API
        env:
          ONESIGNAL_APP_ID: "a0f59924-f1c0-45bb-b3d0-cb836d99604e"
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          echo "--- /api/v1/players ---"
          curl -sS "https://onesignal.com/api/v1/players?app_id=${ONESIGNAL_APP_ID}&limit=10" \
            -H "Authorization: Key ${ONESIGNAL_REST_API_KEY}"
          echo ""
          echo "--- api.onesignal.com/apps/{id}/users ---"
          curl -sS "https://api.onesignal.com/apps/${ONESIGNAL_APP_ID}/users?limit=10" \
            -H "Authorization: Key ${ONESIGNAL_REST_API_KEY}"
