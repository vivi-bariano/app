name: Aggiorna articoli da Substack

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Salva gli articoli precedenti
        run: cp site/data/articles.json /tmp/articles-before.json

      - name: Aggiorna site/data/articles.json
        run: node scripts/fetch-articles.mjs

      - name: Commit se ci sono cambiamenti
        id: commit
        run: |
          if ! git diff --quiet -- site/data/articles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/data/articles.json
            git commit -m "Aggiorna articoli da Substack"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nessuna modifica agli articoli."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Un push fatto con il GITHUB_TOKEN di un'Action non fa ripartire altri
      # workflow (per evitare loop infiniti), quindi il deploy su Pages non
      # scatterebbe da solo: lo avviamo esplicitamente via API.
      - name: Avvia la pubblicazione su Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.ref_name }}"

      - name: Notifica i nuovi articoli (push OneSignal)
        if: steps.commit.outputs.changed == 'true'
        env:
          ONESIGNAL_APP_ID: "a0f59924-f1c0-45bb-b3d0-cb836d99604e"
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node scripts/notify-new-articles.mjs /tmp/articles-before.json site/data/articles.json
