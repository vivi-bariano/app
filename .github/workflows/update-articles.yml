name: Aggiorna articoli da Substack

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Aggiorna site/data/articles.json
        run: node scripts/fetch-articles.mjs

      - name: Commit se ci sono cambiamenti
        run: |
          if ! git diff --quiet -- site/data/articles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add site/data/articles.json
            git commit -m "Aggiorna articoli da Substack"
            git push
          else
            echo "Nessuna modifica agli articoli."
          fi
